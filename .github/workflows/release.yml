name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release -p runlet-server
      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/runlet-server dist/
          tar -czf runlet-server-linux-x86_64.tar.gz -C dist runlet-server
      - uses: actions/upload-artifact@v4
        with:
          name: runlet-server-linux-x86_64
          path: runlet-server-linux-x86_64.tar.gz
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: runlet-server-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
