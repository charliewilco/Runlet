name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go mod download
      - run: mkdir -p dist && go build -o dist/runlet ./cmd/runlet
      - run: tar -C dist -czf runlet-linux-x86_64.tar.gz runlet
      - uses: actions/upload-artifact@v4
        with:
          name: runlet-linux-x86_64
          path: runlet-linux-x86_64.tar.gz
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: runlet-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
